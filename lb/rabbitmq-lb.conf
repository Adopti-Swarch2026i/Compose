worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream rabbitmq_cluster {
        # Primary — receives all traffic under normal conditions.
        # After max_fails consecutive connection failures within fail_timeout,
        # NGINX marks it as unavailable and promotes the backup.
        server rabbitmq:5671       max_fails=3 fail_timeout=15s;

        # Warm spare — receives traffic ONLY when the primary is unavailable.
        # The 'backup' keyword is the core of the warm spare pattern.
        server rabbitmq-spare:5671 max_fails=3 fail_timeout=15s backup;
    }

    server {
        listen 5671;
        proxy_pass            rabbitmq_cluster;
        proxy_connect_timeout 5s;
        # AMQP connections are long-lived (heartbeats ~60s);
        # proxy_timeout must not close idle-but-alive connections.
        proxy_timeout         3600s;
    }
}
