worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream notification_pool {
        least_conn;
        server notification-service-1:8443 max_fails=3 fail_timeout=10s;
        server notification-service-2:8443 max_fails=3 fail_timeout=10s;
        server notification-service-3:8443 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8443;
        proxy_pass notification_pool;
        proxy_connect_timeout 5s;
        proxy_timeout        60s;
    }
}
