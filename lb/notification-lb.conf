worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    log_format upstream_distribution escape=json
        '{"time":"$time_iso8601","protocol":"$protocol","status":$status,'
        '"bytes_sent":$bytes_sent,"bytes_received":$bytes_received,'
        '"session_time":$session_time,"upstream_addr":"$upstream_addr",'
        '"upstream_connect_time":"$upstream_connect_time"}';
    access_log /var/log/nginx/access.log upstream_distribution;

    upstream notification_pool {
        least_conn;
        server notification-service-1:8443 max_fails=1 fail_timeout=2s;
        server notification-service-2:8443 max_fails=1 fail_timeout=2s;
        server notification-service-3:8443 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8443;
        proxy_pass notification_pool;
        proxy_connect_timeout 500ms;
        proxy_next_upstream on;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 2s;
        proxy_timeout        60s;
    }
}
