listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/rabbitmq.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/rabbitmq.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

management.ssl.port       = 15671
management.ssl.cacertfile = /etc/rabbitmq/certs/ca.crt
management.ssl.certfile   = /etc/rabbitmq/certs/rabbitmq.crt
management.ssl.keyfile    = /etc/rabbitmq/certs/rabbitmq.key
management.tcp.port       = 15672

# ── Inter-node Erlang distribution TLS ──────────────────────────────────────
# Note: ssl_dist_optfile is passed via RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS

# ── Cluster formation (classic peer discovery) ───────────────────────────────
cluster_formation.peer_discovery_backend    = classic_config
cluster_formation.classic_config.nodes.1   = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2   = rabbit@rabbitmq-spare
cluster_name                               = adopti-broker-cluster
